name: CI — Lint, Test & Offline Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets deploy.yml gate on this workflow via `uses: ./.github/workflows/ci.yml`
  workflow_call:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy --ignore-missing-imports --no-strict-optional agent/ config/ middleware/ metrics/ resilience/ observability/ evals/ main.py
        continue-on-error: true  # non-blocking until types are fully annotated

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short

  offline-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run offline evals
        run: uv run python -m evals.eval_offline

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-eval-report
          path: evals/reports/offline_latest.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (verify Dockerfile is valid)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: support-bot:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build rival-service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/rival_service
          push: false
          tags: rival-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
