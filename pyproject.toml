[project]
name = "production-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "ruff>=0.15.20",
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Rate limiting
    "slowapi>=0.1.9",
    # LangChain / LangGraph
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    # LangSmith (observability)
    "langsmith>=0.1.0",
    # Safety: PII scrubbing
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
    # Safety: attack detection
    "rival-ai>=0.1.0",
    # RAG: retrieval
    "pageindex>=0.1.0",
    "motor>=3.4.0",
    # Caching
    "gptcache>=0.1.43",
    # Output validation
    "ragas>=0.2.0",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.2
    "langchain-community>=0.4.1,<0.4.2",
    "openai>=1.30.0",
    # Session memory
    "asyncpg>=0.29.0",
    # Resilience
    "tenacity>=8.2.0",
    "pybreaker>=1.2.0",
    # HTTP client
    "httpx>=0.27.0",
    # Logging
    "structlog>=24.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
